name: Build WITCHBORN for Android
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Export and verify Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
      - name: Install Android export requirements
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk fontconfig curl
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Install matching Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 -o /tmp/android_debug.apk "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_android_debug.perfetto.apk"
          curl -fL --retry 3 -o /tmp/android_release.apk "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_android_release.perfetto.apk"
          install -m 644 /tmp/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          install -m 644 /tmp/android_release.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
      - name: Create Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project resources
        run: godot --headless --editor --path . --quit
      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/WITCHBORN-unsigned.apk
      - name: Sign and verify APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          "$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out build/WITCHBORN.apk build/WITCHBORN-unsigned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/WITCHBORN.apk
          test -s build/WITCHBORN.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: WITCHBORN-Android
          path: build/WITCHBORN.apk
          if-no-files-found: error
